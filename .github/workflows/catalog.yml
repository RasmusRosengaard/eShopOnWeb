name: Catalog Service

on:
  push:
    branches: [main]
    paths:
      - 'services/Catalog/**'
jobs:
  pipeline:
    uses: ./.github/workflows/_dotnet-service.yml
    with:
      service: Catalog
      image: catalog # det navn som imaget får bagefter build
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
